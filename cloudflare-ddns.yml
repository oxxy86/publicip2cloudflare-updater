---
- name: Cloudflare DDNS and Docker Compose Management
  hosts: homeserver
  gather_facts: false

  vars:
    api_url: >-
      https://api.cloudflare.com/client/v4/zones/
      {{ cloudflare_zone_id }}/dns_records/{{ cloudflare_record_id }}

  tasks:

    - name: Check connectivity to Cloudflare DNS 1
      shell: ping -c1 -W2 1.1.1.1 >/dev/null 2>&1
      register: ping_cf
      failed_when: false
      changed_when: false

    - name: Check connectivity to Google DNS
      shell: ping -c1 -W2 8.8.8.8 >/dev/null 2>&1
      register: ping_google
      failed_when: false
      changed_when: false

    - name: Determine network state
      set_fact:
        network_ok: >-
          {{ ping_cf.rc == 0 or ping_google.rc == 0 }}

    - name: Read current failure count
      slurp:
        src: "{{ failure_file }}"
      register: failure_data
      failed_when: false

    - name: Set failure count
      set_fact:
        failure_count: >-
          {{
            (failure_data.content | b64decode | trim | int)
            if failure_data.content is defined
            else 0
          }}

    - name: Increase failure count
      copy:
        dest: "{{ failure_file }}"
        content: "{{ failure_count | int + 1 }}"
      when: not network_ok

    - name: Reset failure count
      copy:
        dest: "{{ failure_file }}"
        content: "0"
      when: network_ok

    - name: Calculate new failure count
      set_fact:
        current_failures: >-
          {{
            (failure_count | int + 1)
            if not network_ok
            else 0
          }}

    - name: Read previous state
      slurp:
        src: "{{ state_file }}"
      register: state_data
      failed_when: false

    - name: Set previous state
      set_fact:
        previous_state: >-
          {{
            (state_data.content | b64decode | trim)
            if state_data.content is defined
            else 'UP'
          }}

    - name: Bring compose down after threshold reached
      command: docker compose down
      args:
        chdir: "{{ compose_dir }}"
      when:
        - current_failures >= failure_threshold
        - previous_state != "DOWN"

    - name: Record DOWN state
      copy:
        dest: "{{ state_file }}"
        content: "DOWN"
      when:
        - current_failures >= failure_threshold
        - previous_state != "DOWN"

    - name: Stop execution while internet unavailable
      meta: end_play
      when: not network_ok

    - name: Bring compose up when network restored
      command: docker compose up -d
      args:
        chdir: "{{ compose_dir }}"
      when: previous_state == "DOWN"

    - name: Record UP state
      copy:
        dest: "{{ state_file }}"
        content: "UP"

    - name: Get public IP
      uri:
        url: https://api.ipify.org
        return_content: true
      register: public_ip

    - name: Get Cloudflare record
      uri:
        url: "{{ api_url }}"
        method: GET
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: application/json
      register: cf_record

    - name: Update Cloudflare record when IP changes
      uri:
        url: "{{ api_url }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ cloudflare_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          type: A
          name: "{{ cloudflare_dns_name }}"
          content: "{{ public_ip.content }}"
          ttl: 1
          proxied: false
      when: public_ip.content != cf_record.json.result.content
